# nginx-hub-protokoll.conf — Vorlage fuer die Hub-Auslieferung der Protokollbrowser-PWA
# Phase 06-06 · PROT-04 · D-10.
#
# Diese location-Bloecke in den bestehenden server{}-Block der Hub-nginx einfuegen
# (hub-server/nginx/nginx.conf). Der /api/-Proxy (location /api/ -> backend) besteht
# dort bereits und bedient /api/auth/* + /api/protokoll-sync/* — hier NICHT duplizieren.
#
# Voraussetzung: der gebaute PWA-Ordner app/dist/ ist in den nginx-Container gemountet,
# z.B. im docker-compose(-override) des nginx-Service:
#
#     services:
#       nginx:
#         volumes:
#           - /pfad/zu/protokollbrowser/app/dist:/usr/share/nginx/html/protokoll:ro
#
# Die PWA wird mit VITE base='./' gebaut und laeuft daher unter beliebigem Unterpfad.
# Echte Geraete-Nutzung (HTTPS/Secure-Context fuer GPS + Kamera) = Infra I-4 / Gate G0
# (Phase 07); im LAN-Dev reicht http.

# --- Protokollbrowser-PWA (Static, ausgeliefert unter /protokoll/) ---
location /protokoll/ {
    root /usr/share/nginx/html;               # -> /usr/share/nginx/html/protokoll/<dist>
    index index.html;
    try_files $uri $uri/ /protokoll/index.html;   # SPA-Fallback
}

# version.txt steuert die Update-Mechanik (PROT-04) und darf NIE gecacht werden.
# (Die PWA pollt sie clientseitig bereits mit cache:'no-store'; hier zusaetzlich
#  serverseitig erzwungen, damit auch Zwischen-Caches/Proxies nicht ausliefern.)
location = /protokoll/version.txt {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
    default_type text/plain;
}

# Service-Worker nicht aggressiv cachen (zuverlaessige Update-Erkennung).
location = /protokoll/sw2.js {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache" always;
    default_type application/javascript;
}
