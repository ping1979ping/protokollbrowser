<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Protokoll-App</title>
    <script type="module" crossorigin src="/protokollbrowser/assets/index-DF0VYobm.js"></script>
    <link rel="stylesheet" crossorigin href="/protokollbrowser/assets/index-aed9gQa9.css">
  <link rel="manifest" href="/protokollbrowser/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/protokollbrowser/registerSW.js"></script></head>
  <body>
    <div id="root"></div>
    <script>
      // Dev auto-refresh: fetch version.txt bypassing ALL caches (including SW)
      // If version changed → nuke old SWs + caches → hard reload
      (function() {
        if (!('serviceWorker' in navigator)) return;
        fetch('version.txt', { cache: 'no-store' })
          .then(function(r) { return r.ok ? r.text() : null; })
          .then(function(v) {
            if (!v) return;
            var stored = localStorage.getItem('app_v');
            if (stored && stored !== v) {
              console.log('[AutoRefresh] Neue Version:', v, '(war:', stored, ')');
              caches.keys().then(function(names) {
                return Promise.all(names.map(function(n) {
                  return n.indexOf('map-tiles') === -1 ? caches.delete(n) : null;
                }));
              }).then(function() {
                return navigator.serviceWorker.getRegistrations();
              }).then(function(regs) {
                return Promise.all(regs.map(function(r) { return r.unregister(); }));
              }).then(function() {
                localStorage.setItem('app_v', v);
                location.reload();
              });
            } else {
              localStorage.setItem('app_v', v);
            }
          })
          .catch(function() {});
      })();
    </script>
  </body>
</html>
